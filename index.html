<head>

<style>
:root{--coral:#ED6B5D;--coral-d:#D4534A;--peach:#F7D7BE;--peach-l:#FCEEE4;--cream:#FBF5F0;--ink:#3A3431;--mut:#8A7F78;--line:#F0E4DA;--ok:#3E9B6E;--bad:#C0392B;--bad-l:#FDEDEA}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--cream);color:var(--ink);padding-bottom:calc(74px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button{font-family:inherit}
/* header */
header{position:sticky;top:0;z-index:5;background:#fff;box-shadow:0 1px 0 var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 0}
.top{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.brand img{width:38px;height:38px;border-radius:50%;display:block}
.brand b{font-size:18px;font-weight:800;letter-spacing:-.01em}
.ibtn{background:var(--peach-l);color:var(--coral-d);border:0;border-radius:12px;width:40px;height:40px;font-size:17px;display:grid;place-items:center}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:0;background:var(--peach-l);color:var(--coral-d);font-size:14px;font-weight:600}
.tab.on{background:var(--coral);color:#fff}
/* barra de búsqueda y filtros */
.bar{padding:10px 14px 8px;background:var(--cream);position:sticky;top:var(--hh,110px);z-index:4}
.bar input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;font-size:16px;background:#fff;color:var(--ink);outline:none}
.bar input:focus{border-color:var(--coral)}
.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;white-space:nowrap;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--ink)}
.chip small{color:var(--mut);margin-left:4px;font-weight:600}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on small{color:#e9e2dc}
/* lista */
#list,#home{padding:12px 14px 24px}
.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(58,52,49,.06);border:1px solid var(--line)}
.card.cancel{background:var(--bad-l);border:1.5px solid var(--bad)}
.card.cancel .t{color:var(--bad)}
.cmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.src{display:inline-block;background:var(--peach);color:var(--coral-d);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;margin-right:6px}
.badge-c{display:inline-block;background:var(--bad);color:#fff;border-radius:8px;padding:3px 9px;font-size:11px;font-weight:800;margin-bottom:6px;letter-spacing:.03em}
.card .t{font-weight:700;font-size:17px;margin:8px 0 4px;letter-spacing:-.01em}
.tipo{display:inline-block;background:var(--peach-l);color:var(--ink);border-radius:8px;padding:3px 9px;font-size:12px;font-weight:600}
.cli{font-size:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cli span{font-weight:600}
.edit{border:0;background:none;color:var(--coral-d);font-size:13px;font-weight:700;padding:4px 0}
.note{font-size:13px;color:var(--mut);margin:4px 0}
.tg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tg button{padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:#faf5f1;font-size:13px;color:var(--mut);font-weight:600}
.tg button.on{background:var(--coral);border-color:var(--coral);color:#fff}
.tg button.key{color:var(--ink)}
.fecha{font-size:13px;color:var(--coral-d);margin-top:8px;font-weight:600}
.empty,.msg{text-align:center;color:var(--mut);padding:36px 16px}
/* dashboard */
.hello{font-size:13px;color:var(--mut);margin:2px 2px 12px}
.hello b{display:block;font-size:22px;color:var(--ink);letter-spacing:-.02em}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 10px rgba(58,52,49,.06);text-align:left;border:1px solid var(--line);color:var(--ink);width:100%}
.kpi b{display:block;font-size:32px;color:var(--ink);line-height:1.05;letter-spacing:-.02em}
.kpi span{font-size:12px;color:var(--mut);font-weight:600}
.kpi.main{background:var(--coral);border-color:var(--coral);color:#fff}
.kpi.main b,.kpi.main span{color:#fff}
.kpi.red b{color:var(--bad)}
.sec{margin:18px 4px 8px;font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.ch{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.ch .r{display:flex;justify-content:space-between;align-items:center}

.ch ul{list-style:none;margin:8px 0 0;padding:0}
.ch li{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:14px}

.ch .go{margin-top:10px;width:100%;padding:11px;border:0;border-radius:12px;background:var(--peach-l);color:var(--coral-d);font-size:14px;font-weight:700}
.alert{background:#fff;border:1px dashed var(--coral);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:10px;color:var(--ink)}
.alert button{margin-left:6px;border:0;background:var(--coral);color:#fff;border-radius:999px;padding:7px 14px;font-weight:700}
/* navegación */
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;padding:9px 4px 8px;border:0;background:none;font-size:12px;color:var(--mut);font-weight:600}
nav button b{display:block;font-size:20px;margin-bottom:2px}
nav button.on{color:var(--coral-d)}
#mic{position:fixed;right:16px;bottom:88px;width:60px;height:60px;border-radius:50%;background:var(--coral);color:#fff;font-size:24px;border:0;box-shadow:0 8px 20px rgba(237,107,93,.45);z-index:7}
/* sheets y modales */
#sheet,#voice{position:fixed;inset:0;background:rgba(58,52,49,.35);display:none;z-index:10;align-items:flex-end}
#sheet.on,#voice.on{display:flex}
#sheet .p,#voice .p{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}
#voice .p{max-height:none}
.f{margin:12px 0}
.f label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px;font-weight:600}
.f input[type=text],.f textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
.f .sw{display:flex;align-items:center;justify-content:space-between;background:var(--cream);border-radius:12px;padding:11px 12px}
.f .sw input{width:22px;height:22px;accent-color:var(--coral)}
.row{display:flex;gap:8px;margin-top:14px}
.row button{flex:1;padding:14px;border-radius:14px;border:0;font-size:16px;font-weight:700}
.pri{background:var(--coral);color:#fff}.sec2{background:var(--peach-l);color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 14px;border-radius:14px;font-size:14px;display:none;z-index:20;max-width:92%;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#tact{margin-left:10px;background:none;border:0;color:var(--peach);font-weight:800;font-size:14px}
/* login */
.login{max-width:420px;margin:48px auto;padding:0 22px;text-align:center}
.login img{width:150px;height:150px;border-radius:50%;box-shadow:0 10px 30px rgba(237,107,93,.25)}
.login h2{font-size:24px;letter-spacing:-.02em;margin:18px 0 6px}
.login button,.login input{width:100%;padding:15px;border-radius:14px;font-size:16px;margin-top:12px;font-weight:700}
.login button{background:var(--coral);color:#fff;border:0}
.login input{border:1px solid var(--line)}
.login small{color:var(--mut);display:block;margin-top:14px;line-height:1.45}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--coral);border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-3px}
@keyframes r{to{transform:rotate(360deg)}}
.skel{height:110px;border-radius:18px;background:linear-gradient(90deg,#f3e9e1,#fbf5f0,#f3e9e1);background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:12px}
@keyframes sh{to{background-position:-200% 0}}
.card{position:relative}
.card.sel{border-color:var(--coral);box-shadow:0 0 0 2px var(--coral)}
.selbox{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-weight:800;background:#fff}
.card.sel .selbox{background:var(--coral);border-color:var(--coral)}
.acts{margin-top:6px}
.grp{display:flex;justify-content:space-between;align-items:center;margin:16px 4px 8px;font-size:13px;font-weight:800;color:var(--coral-d);text-transform:uppercase;letter-spacing:.05em}
.grp span{background:var(--peach);color:var(--coral-d);border-radius:999px;padding:2px 10px;font-size:12px}
#bulk{position:fixed;left:10px;right:10px;bottom:calc(68px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;border-radius:16px;padding:10px 12px;display:flex;gap:8px;align-items:center;z-index:8;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#bulk span{flex:1;font-size:14px;font-weight:700}
#bulk button{border:0;border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;background:var(--coral);color:#fff}
#bulk button.sec{background:rgba(255,255,255,.15)}
button.alert{font-size:14px;color:var(--ink);font-family:inherit}
.setcard{background:#fff;border-radius:18px;padding:4px 14px;margin-bottom:12px;border:1px solid var(--line)}
.cfgrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.cfgrow:first-child{border-top:0}
.cfgrow .ctl{display:flex;align-items:center;gap:6px;flex:none}
.mv{border:0;background:var(--peach-l);color:var(--coral-d);border-radius:10px;width:34px;height:34px;font-size:15px;font-weight:800}
.sw2{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:#e3d8cf;position:relative;border:0;flex:none;padding:0}
.sw2::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw2.on{background:var(--coral)}
.sw2.on::after{left:21px}
#tour{position:fixed;inset:0;z-index:9999}
#tour .hole{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(58,52,49,.72);border:2px solid var(--coral);transition:all .25s;pointer-events:none}
#tour .tip{position:fixed;left:12px;right:12px;background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.3);font-size:14px;line-height:1.45;max-width:420px;margin:0 auto}
#tour .tip h4{margin:0 0 6px;font-size:16px;color:var(--coral-d)}
#tour .tb{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}
#tour .tb span{font-size:12px;color:#8a7d75}
#tour .tb button{border:0;border-radius:99px;padding:9px 16px;font-weight:700;background:var(--coral);color:#fff}
#tour .tb button.sk{background:var(--peach-l);color:var(--coral-d)}
.odate{font-size:14px;font-weight:800;color:var(--ink)}.odate i{font-style:normal;font-weight:600;color:var(--coral-d)}
.perx{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0;font-size:13px}.perx input{border:1px solid var(--line);border-radius:10px;padding:7px 8px;font:inherit;max-width:150px;background:#fff}
.cmeta{flex-wrap:wrap;margin-bottom:2px}
.cmeta .rt{margin-left:auto;display:flex;align-items:center;gap:6px}.cmeta .rt small{color:#b5aaa3;font-size:11px}
.cmeta .src{margin:0}
.dpill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;background:var(--peach-l);color:var(--coral-d)}
.dpill.grn{background:#E6F4EC;color:#2E7D56}.dpill.amb{background:#FFF1D6;color:#9A6A00}.dpill.red{background:#FDE3DF;color:#C0392B}.dpill.none{background:#EEE9E5;color:#8A7F78}.dpill.old0{background:#F1ECE8;color:#8A7F78}.dpill.sent{background:#E6F4EC;color:#2E7D56}
.card{border-radius:22px;padding:16px;box-shadow:0 4px 18px rgba(58,52,49,.07);border:0}
.card .t{font-size:18px;line-height:1.25;margin:10px 0 6px}
.tipo{border-radius:999px;padding:4px 11px}
.cli{margin:10px 0 4px;padding-top:10px;border-top:1px dashed var(--line)}
.cli span{font-size:14px;color:var(--ink)}
.edit{background:var(--peach-l);border-radius:999px;padding:6px 14px}
.tg{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px}
.tg button{padding:11px 8px;border-radius:14px;text-align:center;border:0;background:#F6F0EB;font-size:13px}
.tg button.on{box-shadow:0 3px 10px rgba(237,107,93,.35)}
.kpi{border:0;border-radius:22px;box-shadow:0 4px 18px rgba(58,52,49,.07)}
.ch{border:0;border-radius:22px;box-shadow:0 4px 18px rgba(58,52,49,.07)}
.chip{border:0;background:#fff;box-shadow:0 1px 4px rgba(58,52,49,.08)}
.setcard{border:0;box-shadow:0 4px 18px rgba(58,52,49,.06);border-radius:22px}
.perbox{background:#fff;border-radius:22px;padding:14px;margin-bottom:14px;box-shadow:0 4px 18px rgba(58,52,49,.07)}
.perhd{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);font-weight:600}.perhd b{color:var(--ink);font-size:15px}
.perbox .chips{margin-top:10px}.perbox .chip{background:#F6F0EB;box-shadow:none}.perbox .chip.on{background:var(--coral);color:#fff}
.pernd{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--mut)}
.cli{margin:12px 0 2px;padding:0;border:0}
.cli .who{font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
.card .t{font-size:14px;font-weight:600;color:var(--mut);margin:2px 0 8px}
.tgrp{margin:10px 0 4px}.th{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--coral-d);background:var(--peach-l);border-radius:10px;padding:6px 10px}.th i{font-style:normal}

.orow b{display:block;font-size:15px}.orow span{display:block;font-size:13px;color:var(--mut)}.orow small{font-size:11px;color:#b5aaa3;white-space:nowrap;text-align:right}
.csearch{width:100%;box-sizing:border-box;border:0;background:#fff;border-radius:16px;padding:13px 16px;font:inherit;margin:0 0 12px;box-shadow:0 2px 10px rgba(58,52,49,.07)}
.wand{font-size:20px}

<body>
<div id="app"></div>
<div id="sheet"><div class="p" id="sp"></div></div>
<div id="voice"><div class="p" id="vp"></div></div>
<div id="toast"></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
window.JAKE_CLIENT_ID = '952122897469-bf2brihcgrb1t0a3qjksuilt8jiiof02.apps.googleusercontent.com';
const SPREADSHEET_ID = '1cbTcCFGfIDonIwOzJvqeS1pISPzRSyMaqWu0vM1c66g';
const SHEETS = [
  {name:'MercadoLibre', label:'Mercado Libre', short:'ML'},
  {name:'TiendaNube', label:'Tienda Nube', short:'TN'},
  {name:'Wsp y Reclamos', label:'Reclamos / WSP', short:'WSP'}
];
const ALL=-1;
const FLAGS=[{key:'imp',label:'Imprimir'},{key:'prep',label:'Preparar'},{key:'pegar',label:'Pegar'},{key:'embalar',label:'Embalar'},{key:'despachar',label:'Despachar'}];
const API = 'https://sheets.googleapis.com/v4/spreadsheets/' + SPREADSHEET_ID;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const ls = {get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

let token = null, tokenExp = 0, tokenClient = null;
const S = {view:'home', tab:ALL, q:'', filter:'emb', data:{}, loading:false, per:(()=>{try{return JSON.parse(ls.get('per')||'null')}catch(e){return null}})()||{k:'n',n:+(ls.get('days')||60)||0}, limit:60, late:+(ls.get('late')||7), group:ls.get('group')!=='0', selMode:false, sel:new Set(), visible:[]};

function toast(m, ms=2200){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',ms)}
function toastAct(msg,label,fn){
  const t=$('#toast'); t.innerHTML=`${esc(msg)}<button id="tact">${esc(label)}</button>`;
  t.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display='none',6000);
  window.__undo=fn;
}

/* ---------- Sesión persistente ---------- */
(function restoreToken(){ try{const o=JSON.parse(ls.get('tok')||'null'); if(o&&o.exp>Date.now()+60000){token=o.t;tokenExp=o.exp}}catch(e){} })();
function saveToken(){ls.set('tok',JSON.stringify({t:token,exp:tokenExp}))}
function clientId(){return ls.get('cid')||(window.JAKE_CLIENT_ID||'')}
function initToken(){
  if(!window.google||!google.accounts) return false;
  tokenClient = google.accounts.oauth2.initTokenClient({client_id: clientId(), scope:'https://www.googleapis.com/auth/spreadsheets', callback:()=>{}});
  return true;
}
function getToken(interactive, force){
  return new Promise((res,rej)=>{
    if(!force && token && Date.now()<tokenExp-60000) return res(token);
    if(!tokenClient && !initToken()) return rej(new Error('Google todavía no cargó, reintentá.'));
    tokenClient.callback = r=>{
      if(r.error) return rej(new Error(r.error));
      token=r.access_token; tokenExp=Date.now()+(r.expires_in||3600)*1000; ls.set('signed','1'); saveToken(); res(token);
    };
    tokenClient.error_callback = e=>rej(new Error(e.type||'login cancelado'));
    const hint=ls.get('email');
    tokenClient.requestAccessToken(Object.assign({prompt:''}, hint?{login_hint:hint}:{}));
  });
}
function sessionLost(){token=null;tokenExp=0;ls.set('tok','');render()}
async function api(path, opt={}, retry=true){
  let t;
  try{ t = await getToken(false) }catch(e){ sessionLost(); throw new Error('Sesión vencida: tocá "Continuar"') }
  const r = await fetch(API+path,{...opt,headers:{Authorization:'Bearer '+t,'Content-Type':'application/json',...(opt.headers||{})}});
  if(r.status===401){ token=null; tokenExp=0; ls.set('tok',''); if(retry) return api(path,opt,false); sessionLost(); throw new Error('Sesión vencida') }
  const j = await r.json();
  if(!r.ok) throw new Error(j.error?.message||('Error '+r.status));
  return j;
}
function keepAlive(){ if(!token||!(window.google&&google.accounts)) return; if(tokenExp-Date.now()<10*60000) getToken(false,true).catch(()=>{}) }
setInterval(keepAlive,60000);

/* ---------- Fechas ---------- */
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
const pad=n=>String(n).padStart(2,'0');
function hoyTexto(){const d=new Date();return `${DIAS[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${String(d.getFullYear()).slice(2)}`}
function hoySerial(){const d=new Date();return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(1899,11,30))/86400000)}
function colLetter(i){let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s}
function serialText(n){const d=new Date(Date.UTC(1899,11,30)+n*86400000);return `${DIAS[d.getUTCDay()]} ${pad(d.getUTCDate())}/${pad(d.getUTCMonth()+1)}/${String(d.getUTCFullYear()).slice(2)}`}
function dateToSerial(d){return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(1899,11,30))/86400000)}
function dateText(d){return `${DIAS[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${String(d.getFullYear()).slice(2)}`}
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function parseDateWords(str){
  const t=norm(str).trim(), now=new Date(), d0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(/\bhoy\b/.test(t)) return d0;
  if(/\banteayer\b|\banteayer/.test(t)) return new Date(d0.getTime()-2*86400000);
  if(/\bayer\b/.test(t)) return new Date(d0.getTime()-86400000);
  if(/\bmanana\b/.test(t)) return new Date(d0.getTime()+86400000);
  let m=t.match(/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})(?:\s*[\/\-.]\s*(\d{2,4}))?/);
  if(m){ let y=m[3]?+m[3]:now.getFullYear(); if(y<100)y+=2000; return new Date(y,+m[2]-1,+m[1]) }
  m=t.match(/(\d{1,2})\s*(?:de\s*)?(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)(?:\s*(?:de\s*)?(\d{2,4}))?/);
  if(m){ const mi=MESES.indexOf(m[2]==='setiembre'?'septiembre':m[2]); let y=m[3]?+m[3]:now.getFullYear(); if(y<100)y+=2000; return new Date(y,mi,+m[1]) }
  m=t.match(/hace\s*(\d{1,3})\s*dias?/); if(m) return new Date(d0.getTime()-(+m[1])*86400000);
  return null;
}
function parseFecha(v,raw){
  if(typeof raw==='number') return new Date(Date.UTC(1899,11,30)+raw*86400000);
  const m=String(v||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if(!m) return null;
  let y=+m[3]; if(y<100) y+=2000; return new Date(y,+m[2]-1,+m[1]);
}

/* ---------- Parseo de planillas ---------- */
function parseSheet(i, rows, raw){
  const h = rows.findIndex((r,ix)=>ix<12 && r.some(c=>/^embalar/i.test(String(c||'').trim())));
  if(h<0) throw new Error('No encontré los encabezados en '+SHEETS[i].name);
  const head = rows[h].map(x=>String(x||'').trim());
  const ncol = head.length;
  const find = re => head.findIndex(x=>re.test(x));
  const cols = {
    fecha:find(/^fecha( de compra)?$/i), diseno:find(/^dise/i), variante:find(/^variantes?$/i),
    cliente:find(/^nombre/i), notas:find(/^notas/i), enviar:find(/^enviar$/i),
    imp:find(/^imp/i), prep:find(/^prep/i), pegar:find(/^(pegar|armar)/i),
    embalar:find(/^embalar/i), despachar:find(/^despachar/i), fenvio:find(/^fecha (de )?env/i), pago:find(/^pag/i)
  };
  const isBool = head.map((_,c)=>{let n=0,b=0;for(let r=h+1;r<Math.min(raw.length,h+60);r++){const v=raw[r]?.[c];if(v!==undefined&&v!==''){n++;if(typeof v==='boolean')b++}}return n>0&&b/n>.8});
  let dateMode='text';
  if(cols.fenvio>=0){for(let r=raw.length-1;r>h;r--){const v=raw[r]?.[cols.fenvio];if(v!==undefined&&v!==''){dateMode=typeof v==='number'?'serial':'text';break}}}
  const items=[];
  for(let r=h+1;r<rows.length;r++){
    const row=rows[r]||[], rw=raw[r]||[];
    const key=[cols.diseno,cols.cliente,cols.variante].map(c=>c>=0?(row[c]||''):'').join('');
    if(!key.trim()) continue;
    const it={row:r+1, v:Array.from({length:ncol},(_,c)=>row[c]??''), raw:Array.from({length:ncol},(_,c)=>rw[c]??'')};
    it.date = cols.fecha>=0 ? parseFecha(it.v[cols.fecha], it.raw[cols.fecha]) : null;
    items.push(it);
  }
  S.data[i]={head,cols,isBool,dateMode,items,h};
}
async function loadAll(){
  S.loading=true; render();
  try{
    const ranges = SHEETS.map(s=>'ranges='+encodeURIComponent(`'${s.name}'!A1:AA`)).join('&');
    const [f,u] = await Promise.all([
      api(`/values:batchGet?${ranges}&valueRenderOption=FORMATTED_VALUE`),
      api(`/values:batchGet?${ranges}&valueRenderOption=UNFORMATTED_VALUE`)
    ]);
    S.err=null;
    SHEETS.forEach((_,i)=>parseSheet(i, f.valueRanges[i].values||[], u.valueRanges[i].values||[]));
    S.loadedAt=Date.now();
  }catch(e){S.err=e.message;toast(e.message,4500)}
  S.loading=false; render(); notifyBadge(); notifyIfNeeded();
}

/* ---------- Reglas ---------- */
const ok = (it,c)=>c>=0&&(it.raw[c]===true||it.v[c]==='TRUE');
function isCancel(it){return it.v.some(x=>/cancelad/i.test(String(x)))}
function perBounds(){
  const p=S.per||{k:'all'}, now=new Date(), d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(), DAY=86400000;
  if(p.k==='today') return [d0,Infinity];
  if(p.k==='d3') return [d0-2*DAY,Infinity];
  if(p.k==='week'){ const wd=(now.getDay()+6)%7; return [d0-wd*DAY,Infinity] }
  if(p.k==='month') return [new Date(now.getFullYear(),now.getMonth(),1).getTime(),Infinity];
  if(p.k==='n') return p.n>0?[Date.now()-p.n*DAY,Infinity]:[-Infinity,Infinity];
  if(p.k==='custom'){ const f=p.from?new Date(p.from+'T00:00:00').getTime():-Infinity, t=p.to?new Date(p.to+'T23:59:59').getTime():Infinity; return [f,t] }
  return [-Infinity,Infinity];
}
function perLabel(){
  const p=S.per||{}; const L={today:'Hoy',d3:'Últimos 3 días',week:'Esta semana',month:'Este mes',all:'Todo'};
  if(L[p.k]) return L[p.k]; if(p.k==='n') return p.n>0?`Últimos ${p.n} días`:'Todo';
  const f=x=>x?x.split('-').reverse().join('/'):'…'; return `${f(p.from)} → ${f(p.to)}`;
}
function inWindow(it){ if(!it.date) return !CFG.nodate; const [a,b]=perBounds(), t=it.date.getTime(); return t>=a&&t<=b }
function perUI(){
  const p=S.per||{}, on=(k,n)=>p.k===k&&(n===undefined||p.n===n)?'on':'';
  const pre=[['today','Hoy'],['d3','3 días'],['week','Esta semana'],['month','Este mes'],['n:30','30 días'],['n:60','60 días'],['n:90','90 días'],['all','Todo']];
  const custom=p.k==='custom'||(p.k==='n'&&![30,60,90].includes(p.n));
  return `<div class="perbox"><div class="perhd"><span>📅 Período</span><b>${perLabel()}</b></div>
  <div class="chips pc">${pre.map(([k,l])=>{const [kk,nn]=k.split(':');return `<button class="chip ${on(kk,nn?+nn:undefined)}" data-per="${k}">${l}</button>`}).join('')}<button class="chip ${custom||S.perOpen?'on':''}" data-act="perOpen">✎ Personalizar</button></div>
  ${(S.perOpen||custom)?`<div class="perx"><label>Últimos <input type="number" min="1" id="pn" value="${p.k==='n'?p.n:''}" placeholder="N"> días</label></div>
  <div class="perx"><label>Desde <input type="date" id="pf" value="${p.k==='custom'?p.from||'':''}"></label><label>hasta <input type="date" id="pt" value="${p.k==='custom'?p.to||'':''}"></label></div>`:''}
  <div class="pernd"><span>Ignorar pedidos sin fecha</span><button class="sw2 ${CFG.nodate?'on':''}" data-cfg="nodate:1"></button></div></div>`;
}
function setPer(o){ S.per=o; ls.set('per',JSON.stringify(o)); render({keep:true}); notifyBadge() }
function ageTxt(d){ if(!d) return ''; const n=Math.floor((new Date().setHours(0,0,0,0)-new Date(d).setHours(0,0,0,0))/86400000); return n<=0?'hoy':n===1?'ayer':`hace ${n} días` }
/* canc: dice "cancelado" · enviado: despachado · desp: embalado, falta despachar · emb: listo para embalar · prod: en producción */
function stage(it,D){
  const c=D.cols;
  if(isCancel(it)) return 'canc';
  if(ok(it,c.despachar)) return 'enviado';
  if(ok(it,c.embalar)) return 'desp';
  if(ok(it,c.imp)&&ok(it,c.prep)&&ok(it,c.pegar)) return 'emb';
  return 'prod';
}
function tipo(it,D){
  const raw=(D.cols.variante>=0?it.v[D.cols.variante]:'')||'';
  const m=String(raw).match(/set\s*(?:de\s*)?x?\s*(\d)\b[^A-Za-z0-9]*(XXL|XL|L|M|S)\b/i) || String(raw).match(/set\s*(?:de\s*)?x?\s*(\d)/i);
  const fmt = /mdf/i.test(raw)?'MDF': /kiri/i.test(raw)?'Kiri':'Canvas';
  if(!m) return raw.trim()?('Otro: '+raw.trim().slice(0,40)):'Sin variante';
  const size = m[2]?m[2].toUpperCase():'';
  return `Set de ${m[1]}${size?' '+size:''} · ${fmt}`;
}
function isNoPago(it,D,st){return st!=='canc'&&st!=='enviado'&&D.cols.pago>=0&&D.isBool[D.cols.pago]&&!ok(it,D.cols.pago)}
function isLate(it,st){return st!=='canc'&&st!=='enviado'&&!!it.date&&(Date.now()-it.date.getTime())>S.late*86400000}
function rowsFor(tab){
  const out=[];
  SHEETS.forEach((s,si)=>{ if(tab!==ALL&&tab!==si) return; const D=S.data[si]; if(!D) return;
    for(const it of D.items) out.push({si,D,it}) });
  return out;
}
function summarize(){
  const r={emb:[],desp:0,prod:0,canc:0,sinPago:0,late:0,perSheet:[]};
  SHEETS.forEach((s,si)=>{
    const D=S.data[si]; const p={si,emb:[],desp:0,prod:0,canc:0,tipos:{}};
    if(D) for(const it of D.items){
      if(!inWindow(it)) continue;
      const st=stage(it,D);
      if(st==='emb'){p.emb.push(it); const k=tipo(it,D); p.tipos[k]=(p.tipos[k]||0)+1}
      else if(st==='desp') p.desp++;
      else if(st==='prod') p.prod++;
      else if(st==='canc') p.canc++;
      if(isNoPago(it,D,st)) r.sinPago++;
      if(isLate(it,st)) r.late++;
    }
    r.perSheet.push(p);
    r.emb.push(...p.emb.map(it=>({si,it})));
    r.desp+=p.desp; r.prod+=p.prod; r.canc+=p.canc;
  });
  return r;
}
function totalTipos(sum){const t={}; sum.perSheet.forEach(p=>Object.entries(p.tipos).forEach(([k,n])=>t[k]=(t[k]||0)+n)); return t}

async function writeCells(si, item, changes){
  const D=S.data[si], sh=SHEETS[si];
  const data=Object.entries(changes).map(([c,val])=>({range:`'${sh.name}'!${colLetter(+c)}${item.row}`,values:[[val]]}));
  await api('/values:batchUpdate',{method:'POST',body:JSON.stringify({valueInputOption:'USER_ENTERED',data})});
  for(const [c,val] of Object.entries(changes)){
    item.raw[c]=val;
    item.v[c]=(typeof val==='boolean')?(val?'TRUE':'FALSE'):(typeof val==='number'&&+c===D.cols.fenvio?hoyTexto():String(val));
  }
}
function findItem(si,row){return S.data[si].items.find(x=>x.row===row)}
async function setField(si,row,c,nv,fechaOverride){
  const D=S.data[si]; const item=findItem(si,row);
  const ch={[c]:nv};
  if(c===D.cols.despachar && D.cols.fenvio>=0){
    if(fechaOverride!==undefined) ch[D.cols.fenvio]=fechaOverride;
    else if(nv && !String(item.v[D.cols.fenvio]).trim()) ch[D.cols.fenvio]=D.dateMode==='serial'?hoySerial():hoyTexto();
  }
  const old=[...item.raw], oldv=[...item.v];
  for(const [cc,vv] of Object.entries(ch)){
    const n=+cc; item.raw[n]=vv;
    item.v[n]=(typeof vv==='boolean')?(vv?'TRUE':'FALSE'):(typeof vv==='number'&&(n===D.cols.fenvio||n===D.cols.fecha)?serialText(vv):String(vv));
  }
  if(D.cols.fecha>=0) item.date=parseFecha(item.v[D.cols.fecha],item.raw[D.cols.fecha]);
  render({keep:true});
  try{ await writeCells(si,item,ch); notifyBadge(); }
  catch(e){ item.raw=old; item.v=oldv; render({keep:true}); throw e }
}
async function toggle(si,row,c){
  const item=findItem(si,row);
  try{ await setField(si,row,c,!ok(item,c)); toast('✓ Guardado') }
  catch(e){ toast('No se pudo guardar: '+e.message,4500) }
}

function matches(it,D,st){
  const q=norm(S.q.trim());
  if(q && !norm(it.v.join(' ')).includes(q)) return false;
  if(S.filter==='nodate') return !it.date;
  if(S.filter!=='todos' && !inWindow(it)) return false;
  switch(S.filter){
    case 'emb': return st==='emb';
    case 'desp': return st==='desp';
    case 'prod': return st==='prod';
    case 'canc': return st==='canc';
    case 'late': return isLate(it,st);
    case 'nopago': return isNoPago(it,D,st);
    case 'pend': return st!=='enviado'&&st!=='canc';
    default: return true;
  }
}

/* ---------- Selección masiva y compartir ---------- */
const BULK_LABEL={embalar:'Embalado',despachar:'Despachado'};
async function bulk(key){
  const data=[], changed=[];
  for(const k of S.sel){
    const [si,row]=k.split(':').map(Number); const D=S.data[si]; const it=findItem(si,row); if(!it) continue;
    const c=D.cols[key]; if(c<0||ok(it,c)) continue;
    const sh=SHEETS[si]; data.push({range:`'${sh.name}'!${colLetter(c)}${row}`,values:[[true]]});
    const fe=D.cols.fenvio; let fv;
    if(key==='despachar'&&fe>=0&&!String(it.v[fe]).trim()){ fv=D.dateMode==='serial'?hoySerial():hoyTexto(); data.push({range:`'${sh.name}'!${colLetter(fe)}${row}`,values:[[fv]]}) }
    changed.push({si,row,c,fe:fv!==undefined?fe:-1,old:[...it.raw],oldv:[...it.v]});
    it.raw[c]=true; it.v[c]='TRUE';
    if(fv!==undefined){ it.raw[fe]=fv; it.v[fe]=typeof fv==='number'?hoyTexto():fv }
  }
  if(!changed.length){ toast('Ya estaban marcados'); return }
  S.sel.clear(); S.selMode=false; render({keep:true});
  try{
    await api('/values:batchUpdate',{method:'POST',body:JSON.stringify({valueInputOption:'USER_ENTERED',data})});
    notifyBadge();
    toastAct(`✓ ${changed.length} pedidos: ${BULK_LABEL[key]}`,'Deshacer',async()=>{
      const back=[];
      for(const ch of changed){
        const D=S.data[ch.si], it=findItem(ch.si,ch.row), sh=SHEETS[ch.si];
        back.push({range:`'${sh.name}'!${colLetter(ch.c)}${ch.row}`,values:[[false]]});
        if(ch.fe>=0) back.push({range:`'${sh.name}'!${colLetter(ch.fe)}${ch.row}`,values:[['']]});
        it.raw=[...ch.old]; it.v=[...ch.oldv];
      }
      try{ await api('/values:batchUpdate',{method:'POST',body:JSON.stringify({valueInputOption:'USER_ENTERED',data:back})}); render({keep:true}); notifyBadge(); toast('Deshecho') }
      catch(e){ toast('No se pudo deshacer: '+e.message,4000) }
    });
  }catch(e){
    for(const ch of changed){ const it=findItem(ch.si,ch.row); it.raw=ch.old; it.v=ch.oldv }
    render({keep:true}); toast('No se pudo guardar: '+e.message,4500);
  }
}

const FILLER=new Set(['ya','el','la','los','las','un','una','pedido','pedidos','de','del','al','a','y','e','o','en','esta','este','ese','esa','fue','se','lo','que','por','favor','como','marca','marcar','marcalo','tilda','tildalo','tildar','tilde','pone','poni','ponelo','ponele','sacar','saca','quita','quitar','desmarca','desmarcar','sin','no','numero','nro','fila','n','set','es','son','con','para','hoy','ayer','listo','lista','listos','hecho','hecha','hice','mercado','libre','ml','tienda','nube','tn','tiendanube','wsp','whatsapp','reclamo','reclamos','embale','embalo','embalar','embalado','embalada','despache','despachar','despachado','despachada','enviado','enviada','envie','envio','mande','pegado','pegada','pegar','pegue','pego','impreso','impresa','imprimi','imprimir','preparado','preparada','prep','vinilo','vinil','armado','armada']);
function parseVoice(text){
  const t=norm(text);
  const keys=ACTIONS.filter(a=>a.re.test(t)).map(a=>a.key);
  if(!keys.length) return {err:'No entendí qué hacer. Probá: "embalé el pedido de María", "cambiá la fecha de Juan a ayer" o "poné nota de Ana: llamar".'};
  const val=!/\b(no|desmarc|saca|quita|destild|sacar|quitar)\b/.test(t);
  const r=locate(t,keys,null,false); if(r.it) {r.keys=keys;r.val=val} return r;
}
function locate(t,keys,personText,allowCancel){
  let si=null;
  if(/mercado|\bml\b/.test(t)) si=0; else if(/tienda|nube|\btn\b/.test(t)) si=1; else if(/wsp|whats|reclamo/.test(t)) si=2;
  const fm=t.match(/(?:fila|numero|nro)\s*(\d{1,6})/);
  const rowNum=fm?+fm[1]:null;
  const words=norm(personText||t).replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>=2 && !FILLER.has(w) && !/^\d+$/.test(w));
  if(!words.length && rowNum==null) return {err:'¿De qué pedido? Decí el nombre, el diseño o el número de fila.'};
  const cands=[];
  SHEETS.forEach((s,i)=>{
    if(si!==null&&si!==i) return; const D=S.data[i]; if(!D) return;
    for(const it of D.items){
      if((!allowCancel&&isCancel(it))||(!allowCancel&&!inWindow(it))) continue;
      if(rowNum!=null && it.row!==rowNum) continue;
      const hay=norm(it.v.join(' '));
      const score=words.filter(w=>hay.includes(w)).length;
      if(words.length && score<1) continue;
      const st=stage(it,D);
      const rel=keys.some(k=>(k==='embalar'&&st==='emb')||(k==='despachar'&&st==='desp'))?1:0;
      cands.push({si:i,row:it.row,it,D,score,rel});
    }
  });
  if(!cands.length) return {noMatch:true,q:words.join(' ')||('fila '+rowNum)};
  cands.sort((a,b)=>b.score-a.score || b.rel-a.rel || (b.it.date?b.it.date.getTime():0)-(a.it.date?a.it.date.getTime():0));
  const top=cands[0];
  if(words.length && top.score<Math.ceil(words.length/2)) return {noMatch:true,q:words.join(' ')};
  const tie=cands.filter(c=>c.score===top.score && c.rel===top.rel);
  if(tie.length>1) return {ambig:true,cands:tie.slice(0,6)};
  return {si:top.si,row:top.row,it:top.it,D:top.D};
}
const FIELD_KEYS=[
  [/fechaenvio/, 'fenvio','Fecha de envío'],[/fecha/, 'fecha','Fecha del pedido'],[/nota|observ|coment/, 'notas','Notas'],
  [/direccion|enviar|envio/, 'enviar','Enviar'],[/diseno/, 'diseno','Diseño'],[/variante|tamano|formato|talle|set/, 'variante','Variantes'],
  [/cliente|nombre|persona/, 'cliente','Nombre'],[/pago/, 'pago','Pago']];
function parseEdit(text){
  text=text.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/fecha\s+(?:de\s+|del\s+)?envio/ig,'fechaenvio');
  const m=text.match(/\b(?:cambi\w*|pon\w*|modific\w*|actualiz\w*|edit\w*|anot\w*|agreg\w*|escrib\w*|carg\w*|correg\w*)\s+(?:la |el |los |las |una |un )?(.+?)\s+(?:del? pedido (?:de |del |de la )?|de la |del |de |para )(.+?)\s*(?::|\ba\b|\bpor\b|\bcomo\b|\bcon\b|\ben\b)\s*(.+)$/i);
  if(!m) return null;
  const fieldT=norm(m[1]); const fk=FIELD_KEYS.find(f=>f[0].test(fieldT)); if(!fk) return null;
  return {fk,person:m[2],value:m[3].trim()};
}
async function runEdit(text,e){
  const t=norm(text);
  const r=locate(t,[],e.person,true);
  if(r.err) return renderVoice(`Escuché: “${text}”. ${r.err}`);
  if(r.noMatch) return renderVoice(`Escuché: “${text}”. No encontré ningún pedido que coincida con “${e.person}”.`);
  if(r.ambig) return renderVoice(`Escuché: “${text}”. Hay varios pedidos con ese nombre. Decí el número de fila: `+r.cands.map(c=>`${SHEETS[c.si].short} fila ${c.row}: ${c.it.v[c.D.cols.cliente]} · ${c.it.v[c.D.cols.diseno]}`).join(' | '));
  const {si,row,D,it}=r, col=D.cols[e.fk[1]];
  if(col==null||col<0) return renderVoice(`Esa planilla no tiene la columna ${e.fk[2]}.`);
  let nv=e.value, shown=e.value;
  if(e.fk[1]==='fecha'||e.fk[1]==='fenvio'){
    const d=parseDateWords(e.value); if(!d) return renderVoice(`No entendí la fecha “${e.value}”. Decí por ejemplo “hoy”, “ayer” o “15 de octubre”.`);
    const asSerial=typeof it.raw[col]==='number'||(e.fk[1]==='fenvio'&&D.dateMode==='serial');
    nv=asSerial?dateToSerial(d):dateText(d); shown=dateText(d);
  }
  const oldRaw=it.raw[col];
  try{ await setField(si,row,col,nv,e.fk[1]==='fenvio'?undefined:undefined) }
  catch(er){ return renderVoice('No se pudo guardar: '+er.message) }
  $('#voice').classList.remove('on');
  toastAct(`✓ ${e.fk[2]}: ${shown} · ${it.v[D.cols.cliente]} (${SHEETS[si].short} #${row})`,'Deshacer',async()=>{
    try{ await setField(si,row,col,oldRaw); toast('Deshecho') }catch(er){ toast('No se pudo deshacer: '+er.message,4000) }
  });
}
async function runCommand(text){
  const ed=parseEdit(text); if(ed) return runEdit(text,ed);
  const r=parseVoice(text);
  if(r.err) return renderVoice(`Escuché: “${text}”. ${r.err}`);
  if(r.noMatch) return renderVoice(`Escuché: “${text}”. No encontré ningún pedido que coincida con “${r.q}”.`);
  if(r.ambig) return renderVoice(`Escuché: “${text}”. Hay varios pedidos que coinciden. Decí el número de fila: `+r.cands.map(c=>`${SHEETS[c.si].short} fila ${c.row}: ${c.it.v[c.D.cols.cliente]} · ${c.it.v[c.D.cols.diseno]}`).join(' | '));
  const {si,row,keys,val}=r; const D=S.data[si]; const it=findItem(si,row);
  const missing=keys.filter(k=>D.cols[k]<0);
  if(missing.length) return renderVoice(`Esa planilla no tiene la columna ${missing.map(k=>ACTIONS.find(a=>a.key===k).label).join(', ')}.`);
  try{ for(const k of keys){ await setField(si,row,D.cols[k],val) } }
  catch(e){ return renderVoice('No se pudo guardar: '+e.message) }
  const labels=keys.map(k=>ACTIONS.find(a=>a.key===k).label).join(' + ');
  const msg=`${val?'✓':'Quité'} ${labels}: ${it.v[D.cols.cliente]} (${SHEETS[si].short} fila ${row})`;
  $('#voice').classList.remove('on');
  toastAct(msg,'Deshacer',async()=>{
    try{ for(const k of keys){ await setField(si,row,D.cols[k],!val,(k==='despachar'&&val)?'':undefined) } toast('Deshecho') }
    catch(e){ toast('No se pudo deshacer: '+e.message,4000) }
  });
}
function openVoice(){ renderVoice('Tocá Hablar y decí el pedido, o escribilo abajo.') }
function renderVoice(msg, listening){
  $('#vp').innerHTML=`<h3 style="margin:0 0 6px">Asistente de voz</h3><div class="note" style="font-size:14px;color:var(--ink)">${esc(msg)}</div>
    <div class="row" style="margin-top:14px"><button class="pri" id="vhab">${listening?'Escuchando…':'🎤 Hablar'}</button><button class="sec2" id="vcl">Cerrar</button></div>
    <div class="f"><input id="vtxt" type="text" placeholder="ej: ya embalé el de María"></div>
    <div class="note">Ejemplos: "embalé el pedido de María", "despachado Juan Pérez", "pegado y embalado Lucía fila 120", "sacá el embalado de Lucía", "cambiá la fecha de María a ayer", "poné nota de Ana: llamar antes", "cambiá la fecha de envío de Juan a hoy".</div>`;
  $('#voice').classList.add('on');
}
async function ensureMic(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return true;
  try{ const s=await navigator.mediaDevices.getUserMedia({audio:true}); s.getTracks().forEach(t=>t.stop()); return true }
  catch(e){ return false }
}
const VOICE_ERR={
  'not-allowed':'No hay permiso para usar el micrófono. En el navegador tocá el candado de la barra de direcciones (o Ajustes del sitio) y permití el micrófono. Mientras tanto escribí el comando.',
  'service-not-allowed':'El reconocimiento de voz no está permitido en este navegador. Escribí el comando abajo.',
  'audio-capture':'No encuentro el micrófono. Revisá que no lo use otra app.',
  'network':'Sin conexión para reconocer la voz. Escribí el comando abajo.',
  'no-speech':'No escuché nada. Tocá Hablar y hablá después del pitido.',
  'aborted':'Se cortó la escucha. Tocá Hablar de nuevo.',
  'language-not-supported':'Este navegador no tiene español para voz. Escribí el comando abajo.'
};
async function startListen(retry){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ renderVoice('Este navegador no tiene reconocimiento de voz. Escribí el comando abajo.'); return }
  const micOk=await ensureMic();
  if(!micOk){ renderVoice(VOICE_ERR['not-allowed']); return }
  const rec=new SR(); rec.lang='es-AR'; rec.interimResults=false; rec.maxAlternatives=1; rec.continuous=false;
  renderVoice('Hablá ahora…', true);
  let got=false;
  rec.onresult=e=>{ got=true; runCommand(e.results[0][0].transcript) };
  rec.onerror=e=>{
    if(e.error==='aborted' && !retry && !got){ return startListen(true) }
    renderVoice(VOICE_ERR[e.error]||('No te escuché bien ('+e.error+'). Escribí el comando abajo.'));
  };
  rec.onnomatch=()=>renderVoice('No entendí. Probá de nuevo o escribí el comando.');
  rec.onend=()=>{ if(!got && $('#vhab') && $('#vhab').textContent==='Escuchando…') renderVoice('No llegó ninguna frase. Probá de nuevo o escribí el comando.') };
  try{ rec.start() }catch(e){ renderVoice('No pude iniciar el micrófono. Escribí el comando abajo.') }
}

    if(ac.dataset.act==='opensheet') window.open('https://docs.google.com/spreadsheets/d/'+SPREADSHEET_ID+'/edit','_blank');

function cfgFilter(q){
  q=norm(q.trim());
  const root=document.getElementById('home'); if(!root) return;
  [...root.querySelectorAll('.setcard')].forEach(card=>{
    const sec=card.previousElementSibling&&card.previousElementSibling.classList.contains('sec')?card.previousElementSibling:null;
    const secMatch=sec&&q&&norm(sec.textContent).includes(q);
    let any=false;
    card.querySelectorAll('.cfgrow').forEach(r=>{ const m=!q||secMatch||norm(r.textContent).includes(q); r.style.display=m?'':'none'; if(m) any=true });
    card.style.display=any?'':'none'; if(sec) sec.style.display=any?'':'none';
  });
}

  if(e.target.id==='cs'){ cfgFilter(e.target.value); return }

const APP_V='v14';
async function checkUpdate(){
  try{
    const h=await fetch('index.html?'+Date.now(),{cache:'no-store'}).then(r=>r.text());
    const m=h.match(/APP_V='(v\d+)'/);
    if(m&&m[1]!==APP_V&&!sessionStorage.getItem('upd'+m[1])){
      sessionStorage.setItem('upd'+m[1],'1');
      if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))) }
      const rs=await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r=>r.unregister()));
      location.reload();
    }
  }catch(e){}
}
