<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5379">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jake Central">
<title>Jake Central</title>
<style>
:root{--az:#1f5379;--az2:#e8f0f6;--ok:#2e8b57;--bad:#c0392b;--bg:#f5f7f9;--tx:#1b2a35;--mut:#6b7c88}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--az);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 12px 0}
.top{display:flex;align-items:center;gap:10px;padding-bottom:8px}
.top img{height:32px;width:32px;border-radius:50%;background:#fff}
.top h1{font-size:17px;margin:0;flex:1}
.top button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:8px 10px;font-size:15px}
.tabs{display:flex;gap:2px;overflow-x:auto;background:var(--az)}
.tab{flex:1 0 auto;text-align:center;padding:10px 8px;font-size:14px;color:#cfe0ec;background:none;border:0;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:#fff;border-bottom-color:#fff;font-weight:600}
.bar{padding:10px 12px;background:#fff;border-bottom:1px solid #dde4e9;position:sticky;top:var(--hh,96px);z-index:4}
.bar input{width:100%;padding:11px 12px;border:1px solid #cdd7de;border-radius:10px;font-size:16px}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.chip{white-space:nowrap;padding:7px 12px;border-radius:99px;border:1px solid #cdd7de;background:#fff;font-size:13px;color:var(--tx)}
.chip.on{background:var(--az);color:#fff;border-color:var(--az)}
#list,#home{padding:10px 12px 20px}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card.cancel{background:#fdeceb;border:2px solid var(--bad)}
.card.cancel .t{color:var(--bad)}
.badge-c{display:inline-block;background:var(--bad);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;margin-bottom:4px}
.src{display:inline-block;background:var(--az2);color:var(--az);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;margin-left:4px}
.card .h{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut)}
.card .t{font-weight:600;font-size:16px;margin:4px 0 0}
.card .s{font-size:13px;color:var(--mut);margin:2px 0}
.card .c{font-size:14px;margin:2px 0 8px}
.tg{display:flex;flex-wrap:wrap;gap:6px}
.tg button{padding:9px 12px;border-radius:10px;border:1px solid #cdd7de;background:#f1f4f6;font-size:14px;color:var(--mut)}
.tg button.on{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.tg button.key{padding:10px 14px}
.edit{float:right;border:0;background:none;color:var(--az);font-size:14px;padding:0}
.fecha{font-size:13px;color:var(--az);margin-top:6px}
.empty,.msg{text-align:center;color:var(--mut);padding:30px 16px}
/* dashboard */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:center;border:0;color:var(--tx);width:100%}
.kpi b{display:block;font-size:34px;color:var(--az);line-height:1.1}
.kpi span{font-size:12px;color:var(--mut)}
.kpi.warn b{color:#d98c00}.kpi.red b{color:var(--bad)}.kpi.ok b{color:var(--ok)}
.sec{margin:16px 2px 6px;font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.ch{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ch .r{display:flex;justify-content:space-between;align-items:center}
.ch .r b{font-size:16px}.ch .r .n{font-size:26px;font-weight:700;color:var(--az)}
.ch ul{list-style:none;margin:6px 0 0;padding:0}
.ch li{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid #eef1f3;font-size:14px}
.ch li i{font-style:normal;font-weight:700}
.ch .go{margin-top:8px;width:100%;padding:10px;border:0;border-radius:10px;background:var(--az2);color:var(--az);font-size:14px;font-weight:600}
.note{font-size:12px;color:var(--mut);margin:4px 2px}
.alert{background:#fff4e0;border:1px solid #f0c36d;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dde4e9;display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;padding:10px 4px 8px;border:0;background:none;font-size:12px;color:var(--mut)}
nav button b{display:block;font-size:20px}
nav button.on{color:var(--az);font-weight:700}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:10}
#sheet.on{display:flex;align-items:flex-end}
#sheet .p{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(20px + env(safe-area-inset-bottom))}
.f{margin:10px 0}
.f label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.f input[type=text],.f textarea{width:100%;padding:10px;border:1px solid #cdd7de;border-radius:8px;font-size:16px;font-family:inherit}
.f .sw{display:flex;align-items:center;justify-content:space-between;background:#f1f4f6;border-radius:8px;padding:10px 12px}
.f .sw input{width:22px;height:22px}
.row{display:flex;gap:8px;margin-top:14px}
.row button{flex:1;padding:13px;border-radius:10px;border:0;font-size:16px}
.pri{background:var(--az);color:#fff}.sec2{background:#e3e9ee;color:var(--tx)}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:20;max-width:90%}
.login{max-width:420px;margin:40px auto;padding:0 20px;text-align:center}
.login img{width:200px;height:200px;border-radius:50%}
.login button,.login input{width:100%;padding:14px;border-radius:10px;font-size:16px;margin-top:12px}
.login button{background:var(--az);color:#fff;border:0}
.login input{border:1px solid #cdd7de}
.login small{color:var(--mut);display:block;margin-top:14px;line-height:1.4}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #1f5379;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-3px}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"><div class="p" id="sp"></div></div>
<div id="toast"></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
window.JAKE_CLIENT_ID = '952122897469-bf2brihcgrb1t0a3qjksuilt8jiiof02.apps.googleusercontent.com';
const SPREADSHEET_ID = '1cbTcCFGfIDonIwOzJvqeS1pISPzRSyMaqWu0vM1c66g';
const SHEETS = [
  {name:'MercadoLibre', label:'Mercado Libre', short:'ML'},
  {name:'TiendaNube', label:'Tienda Nube', short:'TN'},
  {name:'Wsp y Reclamos', label:'WhatsApp / Reclamos', short:'WSP'}
];
const ALL=-1;
const API = 'https://sheets.googleapis.com/v4/spreadsheets/' + SPREADSHEET_ID;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls = {get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

let token = null, tokenExp = 0, tokenClient = null;
const S = {view:'home', tab:ALL, q:'', filter:'emb', data:{}, loading:false, days:+(ls.get('days')||60), limit:60};

function toast(m, ms=2200){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',ms)}

/* ---------- Sesión persistente ---------- */
(function restoreToken(){
  try{const o=JSON.parse(ls.get('tok')||'null'); if(o&&o.exp>Date.now()+60000){token=o.t;tokenExp=o.exp}}catch(e){}
})();
function saveToken(){ls.set('tok',JSON.stringify({t:token,exp:tokenExp}))}
function getToken(interactive, force){
  return new Promise((res,rej)=>{
    if(!force && token && Date.now()<tokenExp-60000) return res(token);
    if(!tokenClient && !initToken()) return rej(new Error('Google todavía no cargó, reintentá.'));
    tokenClient.callback = r=>{
      if(r.error) return rej(new Error(r.error));
      token=r.access_token; tokenExp=Date.now()+(r.expires_in||3600)*1000; ls.set('signed','1'); saveToken(); res(token);
    };
    tokenClient.error_callback = e=>rej(new Error(e.type||'login cancelado'));
    const hint=ls.get('email');
    tokenClient.requestAccessToken(Object.assign({prompt:''}, hint?{login_hint:hint}:{}));
  });
}
function initToken(){
  if(!window.google||!google.accounts) return false;
  tokenClient = google.accounts.oauth2.initTokenClient({client_id: clientId(), scope:'https://www.googleapis.com/auth/spreadsheets', callback:()=>{}});
  return true;
}
function clientId(){return ls.get('cid')||(window.JAKE_CLIENT_ID||'')}
function sessionLost(){token=null;tokenExp=0;ls.set('tok','');render()}
async function api(path, opt={}, retry=true){
  let t;
  try{ t = await getToken(false) }catch(e){ sessionLost(); throw new Error('Sesión vencida: tocá "Continuar"') }
  const r = await fetch(API+path,{...opt,headers:{Authorization:'Bearer '+t,'Content-Type':'application/json',...(opt.headers||{})}});
  if(r.status===401){ token=null; tokenExp=0; ls.set('tok',''); if(retry) return api(path,opt,false); sessionLost(); throw new Error('Sesión vencida') }
  const j = await r.json();
  if(!r.ok) throw new Error(j.error?.message||('Error '+r.status));
  return j;
}
function keepAlive(){
  if(!token||!(window.google&&google.accounts)) return;
  if(tokenExp-Date.now()<10*60000) getToken(false,true).catch(()=>{});
}
setInterval(keepAlive,60000);

/* ---------- Fechas ---------- */
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
const pad=n=>String(n).padStart(2,'0');
function hoyTexto(){const d=new Date();return `${DIAS[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${String(d.getFullYear()).slice(2)}`}
function hoySerial(){const d=new Date();return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(1899,11,30))/86400000)}
function colLetter(i){let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s}
function parseFecha(v,raw){
  if(typeof raw==='number') return new Date(Date.UTC(1899,11,30)+raw*86400000);
  const m=String(v||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if(!m) return null;
  let y=+m[3]; if(y<100) y+=2000; return new Date(y,+m[2]-1,+m[1]);
}

/* ---------- Parseo ---------- */
function parseSheet(i, rows, raw){
  const h = rows.findIndex((r,ix)=>ix<12 && r.some(c=>/^embalar/i.test(String(c||'').trim())));
  if(h<0) throw new Error('No encontré los encabezados en '+SHEETS[i].name);
  const head = rows[h].map(x=>String(x||'').trim());
  const ncol = head.length;
  const find = re => head.findIndex(x=>re.test(x));
  const cols = {
    fecha:find(/^fecha( de compra)?$/i), diseno:find(/^dise/i), variante:find(/^variantes?$/i),
    cliente:find(/^nombre/i), notas:find(/^notas/i), enviar:find(/^enviar$/i),
    imp:find(/^imp/i), prep:find(/^prep/i), pegar:find(/^(pegar|armar)/i),
    embalar:find(/^embalar/i), despachar:find(/^despachar/i), fenvio:find(/^fecha (de )?env/i), pago:find(/^pag/i)
  };
  const isBool = head.map((_,c)=>{let n=0,b=0;for(let r=h+1;r<Math.min(raw.length,h+60);r++){const v=raw[r]?.[c];if(v!==undefined&&v!==''){n++;if(typeof v==='boolean')b++}}return n>0&&b/n>.8});
  let dateMode='text';
  if(cols.fenvio>=0){for(let r=raw.length-1;r>h;r--){const v=raw[r]?.[cols.fenvio];if(v!==undefined&&v!==''){dateMode=typeof v==='number'?'serial':'text';break}}}
  const items=[];
  for(let r=h+1;r<rows.length;r++){
    const row=rows[r]||[], rw=raw[r]||[];
    const key=[cols.diseno,cols.cliente,cols.variante].map(c=>c>=0?(row[c]||''):'').join('');
    if(!key.trim()) continue;
    const it={row:r+1, v:Array.from({length:ncol},(_,c)=>row[c]??''), raw:Array.from({length:ncol},(_,c)=>rw[c]??'')};
    it.date = cols.fecha>=0 ? parseFecha(it.v[cols.fecha], it.raw[cols.fecha]) : null;
    items.push(it);
  }
  S.data[i]={head,cols,isBool,dateMode,items,h};
}
async function loadAll(){
  S.loading=true; render();
  try{
    const ranges = SHEETS.map(s=>'ranges='+encodeURIComponent(`'${s.name}'!A1:AA`)).join('&');
    const [f,u] = await Promise.all([
      api(`/values:batchGet?${ranges}&valueRenderOption=FORMATTED_VALUE`),
      api(`/values:batchGet?${ranges}&valueRenderOption=UNFORMATTED_VALUE`)
    ]);
    S.err=null;
    SHEETS.forEach((_,i)=>parseSheet(i, f.valueRanges[i].values||[], u.valueRanges[i].values||[]));
    S.loadedAt=Date.now();
  }catch(e){S.err=e.message;toast(e.message,4500)}
  S.loading=false; render(); notifyBadge(); notifyIfNeeded();
}

/* ---------- Reglas ---------- */
const on = (it,c)=>c>=0&&(it.raw[c]===true||it.v[c]==='TRUE');
function isCancel(it){return it.v.some(x=>/cancelad/i.test(String(x)))}
function inWindow(it){ if(!S.days) return true; if(!it.date) return true; return (Date.now()-it.date.getTime())<=S.days*86400000 }
/* estados:
   canc      -> dice "cancelado" en cualquier celda
   enviado   -> Despachar tildado
   desp      -> Embalar tildado, falta despachar
   emb       -> Imp+Prep+Pegar tildados, falta embalar (lo que toca embalar)
   prod      -> todavía no llega al pegado */
function stage(it,D){
  const c=D.cols;
  if(isCancel(it)) return 'canc';
  if(on(it,c.despachar)) return 'enviado';
  if(on(it,c.embalar)) return 'desp';
  if(on(it,c.imp)&&on(it,c.prep)&&on(it,c.pegar)) return 'emb';
  return 'prod';
}
function tipo(it,D){
  const raw=(D.cols.variante>=0?it.v[D.cols.variante]:'')||'';
  const m=String(raw).match(/set\s*(?:de\s*)?x?\s*(\d)\b[^A-Za-z0-9]*(XXL|XL|L|M|S)\b/i) || String(raw).match(/set\s*(?:de\s*)?x?\s*(\d)/i);
  const fmt = /mdf/i.test(raw)?'MDF': /kiri/i.test(raw)?'Kiri':'Canvas';
  if(!m) return raw.trim()?('Otro: '+raw.trim().slice(0,40)):'Sin variante';
  const size = m[2]?m[2].toUpperCase():'';
  return `Set de ${m[1]}${size?' '+size:''} · ${fmt}`;
}
/* lista de filas: unifica todas las planillas o una sola */
function rowsFor(tab){
  const out=[];
  SHEETS.forEach((s,si)=>{ if(tab!==ALL&&tab!==si) return; const D=S.data[si]; if(!D) return;
    for(const it of D.items) out.push({si,D,it}) });
  return out;
}
function summarize(){
  const r={emb:[],desp:0,prod:0,canc:0,sinPago:0,perSheet:[]};
  SHEETS.forEach((s,si)=>{
    const D=S.data[si]; const p={si,emb:[],desp:0,prod:0,canc:0,tipos:{}};
    if(D) for(const it of D.items){
      if(!inWindow(it)) continue;
      const st=stage(it,D);
      if(st==='emb'){p.emb.push(it); const k=tipo(it,D); p.tipos[k]=(p.tipos[k]||0)+1}
      else if(st==='desp') p.desp++;
      else if(st==='prod') p.prod++;
      else if(st==='canc') p.canc++;
      if(st!=='canc'&&st!=='enviado'&&D.cols.pago>=0&&D.isBool[D.cols.pago]&&!on(it,D.cols.pago)) r.sinPago++;
    }
    r.perSheet.push(p);
    r.emb.push(...p.emb.map(it=>({si,it})));
    r.desp+=p.desp; r.prod+=p.prod; r.canc+=p.canc;
  });
  return r;
}
function totalTipos(sum){const t={}; sum.perSheet.forEach(p=>Object.entries(p.tipos).forEach(([k,n])=>t[k]=(t[k]||0)+n)); return t}

/* ---------- Avisos / badge ---------- */
async function notifyIfNeeded(){
  if(!S.data[0]) return;
  const sum=summarize(), total=sum.emb.length;
  const today=new Date().toDateString();
  if(ls.get('notifDay')===today) return;
  if(window.Notification && Notification.permission==='granted' && total>0){
    const body=sum.perSheet.filter(p=>p.emb.length).map(p=>`${SHEETS[p.si].short}: ${p.emb.length}`).join(' · ');
    try{ const reg=await navigator.serviceWorker.ready;
      reg.showNotification(`Hay ${total} pedidos para embalar`,{body,icon:'icon-192.png',badge:'icon-192.png'});
      ls.set('notifDay',today);
    }catch(e){}
  }
}
function notifyBadge(){try{ if(!S.data[0]) return; const t=summarize().emb.length; t?navigator.setAppBadge&&navigator.setAppBadge(t):navigator.clearAppBadge&&navigator.clearAppBadge() }catch(e){}}
async function askNotif(){
  if(!window.Notification){toast('Este navegador no soporta avisos');return}
  const p=await Notification.requestPermission();
  toast(p==='granted'?'Avisos activados':'Avisos bloqueados'); ls.set('notifDay',''); render(); notifyIfNeeded();
}

/* ---------- Escritura (solo tildes y fecha de envío) ---------- */
async function writeCells(si, item, changes){
  const D=S.data[si], sh=SHEETS[si];
  const data=Object.entries(changes).map(([c,val])=>({range:`'${sh.name}'!${colLetter(+c)}${item.row}`,values:[[val]]}));
  await api('/values:batchUpdate',{method:'POST',body:JSON.stringify({valueInputOption:'USER_ENTERED',data})});
  for(const [c,val] of Object.entries(changes)){
    item.raw[c]=val;
    item.v[c]=(typeof val==='boolean')?(val?'TRUE':'FALSE'):(typeof val==='number'&&+c===D.cols.fenvio?hoyTexto():String(val));
  }
}
function findItem(si,row){return S.data[si].items.find(x=>x.row===row)}
async function toggle(si,row,c){
  const D=S.data[si]; const item=findItem(si,row);
  const nv=!on(item,c);
  const ch={[c]:nv};
  if(c===D.cols.despachar && nv && D.cols.fenvio>=0 && !String(item.v[D.cols.fenvio]).trim())
    ch[D.cols.fenvio] = D.dateMode==='serial'?hoySerial():hoyTexto();
  const old=[...item.raw], oldv=[...item.v];
  item.raw[c]=nv; item.v[c]=nv?'TRUE':'FALSE';
  if(ch[D.cols.fenvio]!==undefined){item.raw[D.cols.fenvio]=ch[D.cols.fenvio];item.v[D.cols.fenvio]=hoyTexto()}
  render({keep:true});
  try{await writeCells(si,item,ch);toast('✓ Guardado');notifyBadge()}
  catch(e){item.raw=old;item.v=oldv;render({keep:true});toast('No se pudo guardar: '+e.message,4500)}
}

/* ---------- Render ---------- */
function matches(it,D,st){
  const q=S.q.trim().toLowerCase();
  if(q && !it.v.join(' ').toLowerCase().includes(q)) return false;
  if(S.filter!=='todos' && !inWindow(it)) return false;
  switch(S.filter){
    case 'emb': return st==='emb';
    case 'desp': return st==='desp';
    case 'prod': return st==='prod';
    case 'canc': return st==='canc';
    case 'pend': return st!=='enviado'&&st!=='canc';
    default: return true; // todos
  }
}
function tagBtn(si,row,c,label,key,val){return `<button class="${val?'on':''} ${key?'key':''}" data-t="${si}:${row}:${c}">${val?'✓ ':''}${esc(label)}</button>`}

function renderHome(){
  if(S.loading&&!S.data[0]) return '<div class="msg"><span class="spin"></span> Cargando pedidos…</div>';
  if(!S.data[0]) return `<div class="msg">${esc(S.err||'Sin datos')}<br><br><button class="chip" data-act="reload">Reintentar</button></div>`;
  const sum=summarize();
  let h=`<div class="kpis">
    <button class="kpi ok" data-go="emb"><b>${sum.emb.length}</b><span>Para embalar</span></button>
    <button class="kpi" data-go="desp"><b>${sum.desp}</b><span>Embalados, sin despachar</span></button>
    <button class="kpi warn" data-go="prod"><b>${sum.prod}</b><span>Todavía en producción</span></button>
    <button class="kpi red" data-go="canc"><b>${sum.canc}</b><span>Cancelados</span></button></div>`;
  if(window.Notification && Notification.permission==='default') h+=`<div class="alert" style="margin-top:12px">🔔 <button class="chip on" data-act="notif" style="margin-left:6px">Activar avisos</button></div>`;
  if(sum.sinPago) h+=`<div class="alert" style="margin-top:12px">⚠️ ${sum.sinPago} pedido(s) sin pago confirmado.</div>`;
  h+=`<div class="sec">Para embalar por planilla</div>`;
  sum.perSheet.forEach(p=>{
    const keys=Object.keys(p.tipos).sort((a,b)=>p.tipos[b]-p.tipos[a]);
    h+=`<div class="ch"><div class="r"><b>${SHEETS[p.si].label}</b><span class="n">${p.emb.length}</span></div>`+
      (keys.length?`<ul>${keys.map(k=>`<li><span>${esc(k)}</span><i>${p.tipos[k]}</i></li>`).join('')}</ul>`:'<div class="note">Nada para embalar</div>')+
      `<div class="note">Embalados sin despachar: ${p.desp} · En producción: ${p.prod}${p.canc?` · Cancelados: ${p.canc}`:''}</div>`+
      `<button class="go" data-go-tab="${p.si}">Ver pedidos de ${SHEETS[p.si].short}</button></div>`;
  });
  const tt=totalTipos(sum); const tk=Object.keys(tt).sort((a,b)=>tt[b]-tt[a]);
  if(tk.length) h+=`<div class="sec">Total para embalar por tamaño y formato</div><div class="ch"><ul style="margin:0">${tk.map(k=>`<li><span>${esc(k)}</span><i>${tt[k]}</i></li>`).join('')}</ul></div>`;
  h+=`<div class="sec">Período analizado</div><div class="chips">${[[30,'30 días'],[60,'60 días'],[90,'90 días'],[0,'Todo']].map(([d,l])=>`<button class="chip ${S.days===d?'on':''}" data-days="${d}">${l}</button>`).join('')}</div>
  <div class="note">Para embalar = Imp, Prep Vin y Pegar tildados, sin Embalar ni cancelar. Los pedidos más viejos que el período no cuentan.${S.loadedAt?` · Actualizado ${new Date(S.loadedAt).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}`:''}</div>`;
  return h;
}
function renderSheets(){
  let body='';
  if(S.loading&&!S.data[0]) body='<div class="msg"><span class="spin"></span> Cargando…</div>';
  else if(!S.data[0]) body=`<div class="msg">${esc(S.err||'Sin datos')}<br><br><button class="chip" data-act="reload">Reintentar</button></div>`;
  else{
    const all=rowsFor(S.tab).filter(({D,it})=>matches(it,D,stage(it,D)));
    all.sort((a,b)=>(b.it.date?b.it.date.getTime():0)-(a.it.date?a.it.date.getTime():0) || b.it.row-a.it.row);
    const total=all.length, items=all.slice(0,S.limit);
    body=items.map(({si,D,it})=>{
      const g=c=>c>=0?esc(it.v[c]):'';
      const cancel=isCancel(it);
      const flags=D.head.map((hd,c)=>({hd,c})).filter(x=>D.isBool[x.c]&&x.c!==D.cols.pago&&!/^env[ií]o c/i.test(x.hd));
      const fe=D.cols.fenvio>=0&&it.v[D.cols.fenvio]?`<div class="fecha">📦 Envío: ${esc(it.v[D.cols.fenvio])}</div>`:'';
      return `<div class="card ${cancel?'cancel':''}">${cancel?'<div class="badge-c">CANCELADO</div>':''}
        <div class="h"><span>${g(D.cols.fecha)}<span class="src">${SHEETS[si].short}</span></span><span>fila ${it.row}</span></div>
        <div class="t">${g(D.cols.diseno)||'(sin diseño)'}</div>
        <div class="s">${g(D.cols.variante)}</div>
        <div class="c">${g(D.cols.cliente)} <button class="edit" data-e="${si}:${it.row}">Editar ✎</button></div>
        ${D.cols.notas>=0&&it.v[D.cols.notas]?`<div class="s">📝 ${g(D.cols.notas)}</div>`:''}
        ${D.cols.enviar>=0&&it.v[D.cols.enviar]?`<div class="s">🚚 ${g(D.cols.enviar)}</div>`:''}
        <div class="tg">${flags.map(x=>tagBtn(si,it.row,x.c,x.hd.replace(/\s*\(.*\)/,''),x.c===D.cols.embalar||x.c===D.cols.despachar,on(it,x.c))).join('')}</div>${fe}</div>`;
    }).join('');
    if(!items.length) body='<div class="empty">Nada para mostrar con este filtro.</div>';
    else if(total>items.length) body+=`<div class="msg"><button class="chip" id="more">Ver más (${total-items.length})</button></div>`;
  }
  const F=[['emb','Para embalar'],['desp','Embalados'],['prod','Producción'],['pend','Sin despachar'],['canc','Cancelados'],['todos','Todos']];
  const TABS=[[ALL,'Todas'],...SHEETS.map((s,i)=>[i,s.label])];
  return `<div class="tabs">${TABS.map(([k,l])=>`<button class="tab ${S.tab===k?'on':''}" data-tab="${k}">${l}</button>`).join('')}</div>
    <div class="bar"><input id="q" type="search" placeholder="Buscar cliente, diseño, notas…" value="${esc(S.q)}">
    <div class="chips">${F.map(([k,l])=>`<button class="chip ${S.filter===k?'on':''}" data-f="${k}">${l}</button>`).join('')}</div></div><div id="list">${body}</div>`;
}
function render(opt={}){
  const y=window.scrollY;
  if(!clientId()) return renderSetup();
  if(!token) return renderLogin();
  const home=S.view==='home';
  $('#app').innerHTML=`<header><div class="top"><img src="icon-192.png" alt=""><h1>Jake Central</h1><button data-act="reload">⟳</button><button id="lo">Salir</button></div></header>
    ${home?`<div id="home">${renderHome()}</div>`:renderSheets()}
    <nav><button class="${home?'on':''}" data-view="home"><b>📊</b>Inicio</button><button class="${!home?'on':''}" data-view="sheets"><b>📋</b>Pedidos</button></nav>`;
  const hh=document.querySelector('header').offsetHeight; document.documentElement.style.setProperty('--hh',(hh+(home?0:44))+'px');
  if(opt.keep) window.scrollTo(0,y);
  const q=$('#q'); if(q&&S.focusQ){q.focus();q.setSelectionRange(q.value.length,q.value.length)}
}
function renderSetup(){
  $('#app').innerHTML=`<div class="login"><img src="icon-512.png"><h2>Configuración inicial</h2><p>Pegá acá el <b>Client ID</b> de Google.</p>
  <input id="cid" placeholder="123456-abc.apps.googleusercontent.com"><button id="scid">Guardar</button></div>`;
}
function renderLogin(){
  $('#app').innerHTML=`<div class="login"><img src="icon-512.png"><h2>Jake Central</h2>
  <button id="go">${ls.get('signed')==='1'?'Continuar':'Ingresar con Google'}</button><small>Usá la cuenta que tiene acceso a la planilla “Planillas de PEDIDOS”. La sesión queda guardada en este dispositivo.</small></div>`;
}
function openEdit(si,rowNum){
  const D=S.data[si], it=findItem(si,rowNum);
  const fields=D.head.map((hd,c)=>({hd,c})).filter(x=>x.hd);
  $('#sp').innerHTML=`<h3 style="margin:0">${SHEETS[si].label} · fila ${rowNum}</h3><div class="note">${esc(it.v[D.cols.cliente]||'')}</div>`+fields.map(({hd,c})=>{
    if(D.isBool[c]) return `<div class="f"><div class="sw"><label style="margin:0;font-size:15px;color:#1b2a35">${esc(hd)}</label><input type="checkbox" data-c="${c}" ${on(it,c)?'checked':''}></div></div>`;
    const long=String(it.v[c]).length>40||/notas|observ|variante/i.test(hd);
    return `<div class="f"><label>${esc(hd)}</label>${long?`<textarea rows="2" data-c="${c}">${esc(it.v[c])}</textarea>`:`<input type="text" data-c="${c}" value="${esc(it.v[c])}">`}</div>`;
  }).join('')+`<div class="row"><button class="sec2" id="cx">Cancelar</button><button class="pri" id="sv">Guardar</button></div>`;
  $('#sheet').classList.add('on'); $('#sheet').dataset.si=si; $('#sheet').dataset.row=rowNum;
}
async function saveEdit(){
  const si=+$('#sheet').dataset.si, rowNum=+$('#sheet').dataset.row, D=S.data[si], it=findItem(si,rowNum);
  const ch={};
  document.querySelectorAll('#sp [data-c]').forEach(el=>{
    const c=+el.dataset.c;
    if(el.type==='checkbox'){if(el.checked!==on(it,c))ch[c]=el.checked}
    else if(el.value!==String(it.v[c])) ch[c]=el.value;
  });
  if(ch[D.cols.despachar]===true && D.cols.fenvio>=0 && ch[D.cols.fenvio]===undefined && !String(it.v[D.cols.fenvio]).trim())
    ch[D.cols.fenvio]=D.dateMode==='serial'?hoySerial():hoyTexto();
  if(!Object.keys(ch).length){$('#sheet').classList.remove('on');return}
  const b=$('#sv');b.innerHTML='<span class="spin" style="border-color:#fff;border-top-color:transparent"></span>';
  try{await writeCells(si,it,ch);$('#sheet').classList.remove('on');toast('✓ Guardado');render({keep:true});notifyBadge()}
  catch(e){toast('No se pudo guardar: '+e.message,4500);b.textContent='Guardar'}
}

/* ---------- Eventos ---------- */
document.addEventListener('click',async e=>{
  const t=e.target;
  const v=t.closest('[data-view]'); if(v){S.view=v.dataset.view;S.focusQ=false;render();window.scrollTo(0,0);return}
  const gf=t.closest('[data-go]'); if(gf){S.view='sheets';S.tab=ALL;S.filter=gf.dataset.go;S.q='';S.limit=60;S.focusQ=false;render();window.scrollTo(0,0);return}
  const gt=t.closest('[data-go-tab]'); if(gt){S.view='sheets';S.tab=+gt.dataset.goTab;S.filter='emb';S.q='';S.limit=60;S.focusQ=false;render();window.scrollTo(0,0);return}
  const tabEl=t.closest('[data-tab]'); if(tabEl){S.tab=+tabEl.dataset.tab;S.limit=60;S.focusQ=false;render();window.scrollTo(0,0);return}
  const fl=t.closest('[data-f]'); if(fl){S.filter=fl.dataset.f;S.limit=60;S.focusQ=false;render();window.scrollTo(0,0);return}
  const dy=t.closest('[data-days]'); if(dy){S.days=+dy.dataset.days;ls.set('days',S.days);render({keep:true});notifyBadge();return}
  const tg=t.closest('[data-t]'); if(tg){const [si,r,c]=tg.dataset.t.split(':').map(Number);toggle(si,r,c);return}
  const ed=t.closest('[data-e]'); if(ed){const [si,r]=ed.dataset.e.split(':').map(Number);openEdit(si,r);return}
  const ac=t.closest('[data-act]'); if(ac){ if(ac.dataset.act==='reload') loadAll(); if(ac.dataset.act==='notif') askNotif(); return}
  if(t.id==='more'){S.limit+=60;render({keep:true});return}
  if(t.id==='lo'){token=null;tokenExp=0;ls.set('signed','');ls.set('tok','');render();return}
  if(t.id==='cx'||t.id==='sheet'){$('#sheet').classList.remove('on');return}
  if(t.id==='sv'){saveEdit();return}
  if(t.id==='go'){try{await getToken(true);loadAll()}catch(err){toast('Login: '+err.message,4000)}return}
  if(t.id==='scid'){const v2=$('#cid').value.trim();if(v2){ls.set('cid',v2);tokenClient=null;render()}return}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;S.focusQ=true;S.limit=60;clearTimeout(S.dt);S.dt=setTimeout(()=>render({keep:true}),200)}});
document.addEventListener('visibilitychange',async()=>{
  if(document.hidden) return;
  if(token){ keepAlive(); if(S.loadedAt&&Date.now()-S.loadedAt>5*60000) loadAll(); }
  else if(ls.get('signed')==='1'&&window.google&&google.accounts){ try{await getToken(false,true);loadAll()}catch(e){} }
});

window.addEventListener('load',()=>{
  if(!ls.get('email')) ls.set('email','fakundo713@gmail.com');
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(token){ render(); loadAll(); } else render();
  if(clientId()&&ls.get('signed')==='1'){
    let n=0;const iv=setInterval(async()=>{
      if(window.google&&google.accounts){
        clearInterval(iv);
        if(!token){ try{await getToken(false,true);loadAll()}catch(e){render()} }
        else keepAlive();
      } else if(++n>50) clearInterval(iv);
    },200);
  }
});
</script>
</body>
